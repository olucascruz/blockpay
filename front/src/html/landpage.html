<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BlockPay</title>

  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  
  <!-- Estilo personalizado -->
  <link rel="stylesheet" href="../css/landing.css" />
</head>
<body class="d-flex flex-column min-vh-100 bg-light">

  <!-- Header -->
  <header class="bg-primary text-white py-4">
    <div class="container text-center">
      <h1 class="display-4">Welcome to <span class="fw-bold">BlockPay</span></h1>
    </div>
  </header>

  <!-- Main -->
  <main class="flex-grow-1 d-flex align-items-center justify-content-center text-center">
    <div class="container">
      <p class="lead mb-4">Your secure and reliable payment solution.</p>
      <div class="d-grid gap-3 d-sm-flex justify-content-sm-center">
        <button id="btn-login" class="btn btn-success btn-lg">Entrar</button>
        <button id="btn-cadastro" class="btn btn-outline-primary btn-lg">Cadastro</button>
      </div>
    </div>
  </main>

  <!-- Footer -->
  <footer class="bg-dark text-white text-center py-3 mt-auto">
    <p class="mb-0">&copy; 2023 BlockPay. All rights reserved.</p>
  </footer>

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script type="module" src="../js/main.js"></script>
</body>
</html>
