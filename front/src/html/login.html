<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Página de Login - BlockPay</title>

  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  
  <!-- Estilo personalizado -->
  <link rel="stylesheet" href="../css/login.css" />
</head>
<body class="d-flex flex-column justify-content-center align-items-center min-vh-100 bg-light">

  <div class="card p-4 shadow-lg" style="width: 100%; max-width: 400px;">
    <div class="text-center mb-4">
      <h1 class="text-primary fw-bold">BlockPay</h1>
      <h2 class="h5 text-secondary">Login</h2>
    </div>

    <form id="form-login">
      <div class="mb-3">
        <label for="email" class="form-label">E-mail:</label>
        <input type="email" class="form-control" id="email" name="email" required />
      </div>

      <div class="mb-3">
        <label for="senha" class="form-label">Senha:</label>
        <input type="password" class="form-control" id="senha" name="senha" required />
      </div>

      <div class="d-grid gap-2 d-md-flex justify-content-md-between">
        <button type="submit" class="btn btn-success">Entrar</button>
        <button type="button" class="btn btn-outline-primary" id="btn-cadastro">Cadastro</button>
        <button type="button" class="btn btn-outline-secondary" id="btn-landpage">Voltar</button>
      </div>
    </form>
  </div>

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script type="module" src="../js/main.js"></script>
</body>
</html>
