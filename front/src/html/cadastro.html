<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>Cadastro</title>

  <!-- Bootstrap CSS -->
  <link 
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" 
    rel="stylesheet"
  >
  <!-- Estilos personalizados -->
  <link rel="stylesheet" href="../css/cadastro.css">
</head>
<body>

  <div class="container d-flex align-items-center justify-content-center min-vh-100">
    <div class="card p-4 w-100" style="max-width: 500px;">
      <h1 class="text-center mb-3">BlockPay</h1>
      <h2 class="text-center mb-4">Cadastro</h2>

      <form id="form-cadastro">
        <div class="mb-3">
          <label for="nome" class="form-label">Nome:</label>
          <input type="text" id="nome" name="nome" class="form-control" required>
        </div>

        <div class="mb-3">
          <label for="email" class="form-label">E-mail:</label>
          <input type="email" id="email" name="email" class="form-control" required>
        </div>

        <div class="mb-3">
          <label for="senha" class="form-label">Senha:</label>
          <input type="password" id="senha" name="senha" class="form-control" required>
        </div>

        <div class="mb-4">
          <label for="confirmar" class="form-label">Confirmar Senha:</label>
          <input type="password" id="confirmar" name="confirmar_senha" class="form-control" required>
        </div>

        <div class="d-flex justify-content-between">
          <button type="button" id="btn-login" class="btn btn-outline-primary">Voltar</button>
          <button type="submit" class="btn btn-primary">Cadastrar</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Bootstrap JS -->
  <script 
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
  </script>
  <script type="module" src="../js/main.js"></script>
</body>
</html>
