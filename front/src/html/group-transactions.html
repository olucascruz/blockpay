<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>BlockPay - Transações do Grupo</title>
  <!-- CDN do Bootstrap -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <!-- Link para o CSS externo -->
  <link rel="stylesheet" href="../css/group-transactions.css">
  <!-- Script do Chart.js -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
  <div class="container my-5">
    <!-- Cabeçalho -->
    <header class="d-flex justify-content-between align-items-center mb-4">
      <h1 class="h2">Transações Registradas no Grupo</h1>
      <button id="btn-home" class="btn btn-primary">Home</button>
    </header>

    <!-- Lista de Transações -->
    <section id="lista-transacoes" class="mb-5">
      <h2 class="h4 mb-3">Transações do Grupo</h2>
      <ul id="transacoes-lista" class="list-group"></ul>
    </section>

    <!-- Seção de Gráficos -->
    <section id="graficos">
      <h2 class="h4 mb-3">Visualização de Gastos</h2>
      <div id="grafico-total" class="mb-4"></div>
      <div class="row">
        <div class="col-md-6 mb-4">
          <canvas id="grafico-gastos-por-integrante"></canvas>
        </div>
        <div class="col-md-6 mb-4">
          <canvas id="grafico-gastos-por-tipo"></canvas>
        </div>
      </div>
    </section>
  </div>

  <!-- Script para manipular dados e gráficos -->
  <script type="module">
    import { getUsuarioLogado } from "../js/authentication.js";
    import { getGrupoDoUsuario } from "../js/groups.js";
    import { getTransacoesPorUsuario } from "../js/transaction.js";
    import { getUserById } from "../js/users.js";

    function downloadBase64(base64, nomeArquivoBase) {
      const arr = base64.split(",");
      const mime = arr[0].match(/:(.*?);/)[1];
      const ext = mime.split("/")[1];
      const nomeArquivo = nomeArquivoBase + "." + ext;

      const byteString = atob(arr[1]);
      const ab = new ArrayBuffer(byteString.length);
      const ia = new Uint8Array(ab);
      for (let i = 0; i < byteString.length; i++) {
        ia[i] = byteString.charCodeAt(i);
      }

      const blob = new Blob([ab], { type: mime });
      const url = URL.createObjectURL(blob);

      const a = document.createElement("a");
      a.href = url;
      a.download = nomeArquivo;
      a.click();

      URL.revokeObjectURL(url);
    }

    document.addEventListener("DOMContentLoaded", async () => {
      const lista = document.getElementById("transacoes-lista");
      const btnHome = document.getElementById("btn-home");

      btnHome.addEventListener("click", () => {
        window.location.href = "home.html";
      });

      try {
        const usuario = getUsuarioLogado();
        if (!usuario) {
          lista.innerHTML = "<li>Usuário não logado.</li>";
          return;
        }

        const grupo = await getGrupoDoUsuario(usuario.id);
        if (!grupo) {
          lista.innerHTML = "<li>Você não está em um grupo.</li>";
          return;
        }

        const membros = grupo.participantes;
        if (membros.length === 0) {
          lista.innerHTML = "<li>Seu grupo não possui membros.</li>";
          return;
        }

        const gastosPorIntegrante = {};
        const gastosPorTipo = {};
        let totalTransacoes = 0;

        for (const idMembro of membros) {
          const transacoes = await getTransacoesPorUsuario(idMembro);
          const user = await getUserById(idMembro);
          const nomeMembro = user[0].nome;

          if (transacoes.length > 0) {
            const tituloMembro = document.createElement("h3");
            tituloMembro.textContent = "Transações de " + nomeMembro;
            lista.appendChild(tituloMembro);
          }

          transacoes.forEach(t => {
            const li = document.createElement("li");

            const preco = Number(t.preco);
            const precoFormatado = preco.toLocaleString("pt-BR", {
              style: "currency",
              currency: "BRL"
            });

            const data = new Date(t.data);
            const dataFormatada = data.toLocaleString('pt-BR', {
              day: '2-digit', month: 'long', year: 'numeric',
              hour: '2-digit', minute: '2-digit'
            });

            li.innerHTML = `
              <div>
                <h4>${t.nome}</h4>
                <p><strong>Valor:</strong> ${precoFormatado}</p>
                <p><strong>Tipo:</strong> ${t.tipo}</p>
                <p><strong>Descrição:</strong> ${t.descricao}</p>
                <p><strong>Data:</strong> ${dataFormatada}</p>
              </div>
            `;

            if (t.base64) {
              const botaoDownload = document.createElement("button");
              botaoDownload.textContent = "Baixar Arquivo";
              botaoDownload.addEventListener("click", () => {
                downloadBase64(t.base64, t.nome || "arquivo");
              });
              li.appendChild(botaoDownload);
            }

            lista.appendChild(li);
            totalTransacoes++;

            // Coletar dados para gráficos
            gastosPorIntegrante[nomeMembro] = (gastosPorIntegrante[nomeMembro] || 0) + preco;
            gastosPorTipo[t.tipo] = (gastosPorTipo[t.tipo] || 0) + preco;
          });
        }

        if (totalTransacoes === 0) {
          lista.innerHTML = "<li>Nenhuma transação encontrada no grupo.</li>";
        }

        const totalGastoDiv = document.createElement("div");
        totalGastoDiv.innerHTML = `
          <h2>Total Gasto pelo Grupo</h2>
          <p style="font-size: 1.2em; font-weight: bold; color: darkgreen;">
            ${Object.values(gastosPorIntegrante)
              .reduce((acc, val) => acc + val, 0)
              .toLocaleString("pt-BR", { style: "currency", currency: "BRL" })}
          </p>
        `;
        document.getElementById("graficos").prepend(totalGastoDiv);

        // Gráfico 1: Gastos por integrante
        const ctx1 = document.getElementById("grafico-gastos-por-integrante");
        new Chart(ctx1, {
          type: "bar",
          data: {
            labels: Object.keys(gastosPorIntegrante),
            datasets: [{
              label: "Total Gasto (R$)",
              data: Object.values(gastosPorIntegrante),
              backgroundColor: "rgba(54, 162, 235, 0.6)"
            }]
          },
          options: {
            responsive: true,
            plugins: {
              title: {
                display: true,
                text: "Total Gasto por Integrante"
              }
            }
          }
        });

        // Gráfico 2: Gastos por tipo
        const ctx2 = document.getElementById("grafico-gastos-por-tipo");
        new Chart(ctx2, {
          type: "pie",
          data: {
            labels: Object.keys(gastosPorTipo),
            datasets: [{
              label: "Gastos por Tipo",
              data: Object.values(gastosPorTipo),
              backgroundColor: [
                "#FF6384", "#36A2EB", "#FFCE56", "#4BC0C0", "#9966FF", "#FF9F40"
              ]
            }]
          },
          options: {
            responsive: true,
            plugins: {
              title: {
                display: true,
                text: "Distribuição dos Gastos por Tipo"
              }
            }
          }
        });

      } catch (error) {
        console.error("Erro ao carregar transações do grupo:", error);
        lista.innerHTML = "<li>Erro ao carregar transações. Detalhes: " + error.message + "</li>";
      }
    });
  </script>

  <!-- Script para o gerenciamento geral da página -->
  <script type="module" src="../js/main.js"></script>
</body>
</html>
