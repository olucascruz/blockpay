<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>BlockPay - Transações</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="../css/transactions.css">
</head>
<body class="bg-light">

  <nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
    <div class="container-fluid">
      <a class="navbar-brand" href="#">BlockPay</a>
      <div>
        <button id="btn-home" class="btn btn-outline-light me-2">Home</button>
        <button id="btn-add-transacao" class="btn btn-outline-success">Adicionar Transação</button>
      </div>
    </div>
  </nav>

  <div class="container">
    <h2 class="mb-4">Suas Transações</h2>
    <ul id="transacoes-lista" class="list-unstyled">
      <!-- Preenchido via JavaScript -->
    </ul>
  </div>

  <!-- Bootstrap JS Bundle (inclui Popper) -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

  <script type="module">
    import { getUsuarioLogado } from "../js/authentication.js";
    import { getTransacoesPorUsuario } from "../js/transaction.js";

    function downloadBase64(base64, nomeArquivoBase) {
      const arr = base64.split(",");
      const mime = arr[0].match(/:(.*?);/)[1];
      const ext = mime.split("/")[1];
      const nomeArquivo = `${nomeArquivoBase}.${ext}`;

      const byteString = atob(arr[1]);
      const ab = new ArrayBuffer(byteString.length);
      const ia = new Uint8Array(ab);
      for (let i = 0; i < byteString.length; i++) {
        ia[i] = byteString.charCodeAt(i);
      }

      const blob = new Blob([ab], { type: mime });
      const url = URL.createObjectURL(blob);

      const a = document.createElement("a");
      a.href = url;
      a.download = nomeArquivo;
      a.click();
      URL.revokeObjectURL(url);
    }

    document.addEventListener("DOMContentLoaded", async () => {
      const lista = document.getElementById("transacoes-lista");

      try {
        const usuario = getUsuarioLogado();
        if (!usuario) {
          lista.innerHTML = "<li class='text-danger'>Usuário não logado</li>";
          return;
        }

        const transacoes = await getTransacoesPorUsuario(usuario.id);
        if (transacoes.length === 0) {
          lista.innerHTML = "<li class='text-muted'>Nenhuma transação encontrada</li>";
          return;
        }

        transacoes.forEach(t => {
          const precoFormatado = Number(t.preco).toLocaleString("pt-BR", {
            style: "currency",
            currency: "BRL"
          });

          const data = new Date(t.data);
          const dataFormatada = data.toLocaleString('pt-BR', {
            day: '2-digit', month: 'long', year: 'numeric',
            hour: '2-digit', minute: '2-digit'
          });

          const li = document.createElement("li");
          li.innerHTML = `
            <div class="card mb-3 shadow-sm">
              <div class="card-body">
                <h5 class="card-title">${t.nome}</h5>
                <p class="card-text"><strong>Valor:</strong> ${precoFormatado}</p>
                <p class="card-text"><strong>Tipo:</strong> ${t.tipo}</p>
                <p class="card-text"><strong>Descrição:</strong> ${t.descricao}</p>
                <p class="card-text"><strong>Data:</strong> ${dataFormatada}</p>
              </div>
            </div>
          `;

          if (t.base64) {
            const botaoDownload = document.createElement("button");
            botaoDownload.className = "btn btn-sm btn-primary mb-3 ms-3";
            botaoDownload.textContent = "Baixar Arquivo";
            botaoDownload.addEventListener("click", () => {
              downloadBase64(t.base64, t.nome || "arquivo");
            });
            li.querySelector(".card-body").appendChild(botaoDownload);
          }

          lista.appendChild(li);
        });
      } catch (e) {
        console.error("Erro ao carregar transações:", e);
        lista.innerHTML = "<li class='text-danger'>Erro ao carregar transações</li>";
      }
    });
  </script>

  <script type="module" src="../js/main.js"></script>
</body>
</html>
